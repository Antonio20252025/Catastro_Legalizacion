<!DOCTYPE html>
<html>
<head>
<title>Mapa Catastro por Años</title>
<meta charset="UTF-8">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet.fullscreen@latest/Control.FullScreen.css"/>
<script src="https://unpkg.com/leaflet.fullscreen@latest/Control.FullScreen.js"></script>

<style>

#mapa{
height:500px;
border:2px solid #004bad;
}

.titulo{
text-align:center;
line-height:0.5;
}

.logo-manta{
position:absolute;
left:20px;
top:20px;
width:300px;
z-index:1000;
}

/* PANEL HISTORICO */

#controlTiempo{
position:absolute;
bottom:20px;
left:50px;
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 0 8px gray;
z-index:1000;
width:220px;
text-align:center;
font-weight:bold;
}

/* CONTADOR */

#contadorPredios{
font-size:20px;
margin-top:10px;
animation: parpadeo 1s infinite;
}

@keyframes parpadeo{
0%{opacity:1;}
50%{opacity:0.3;}
100%{opacity:1;}
}

/* BUSCADOR */

#buscadorPredio{
position:absolute;
bottom:20px;
right:40px;
background:white;
padding:10px;
border-radius:8px;
box-shadow:0 0 5px gray;
z-index:1000;
font-weight:bold;
}

</style>
</head>

<body style="background:#d2e2f7; margin:20px;">

<div class="titulo">
<h1>GAD MANTA</h1>
<h3>Elaborado por: Ing. Santana Castro Antonio Gilberto</h3>
<h3>Arq. María Angélica Delgado Cedeño</h3>
<h3>Arq. Conforme Marvin Enrrique</h3>
<h3>Arq. Rios Borrero Pedro Richard</h3>
<img src="imagenmanta.png" class="logo-manta">
</div>

<div id="mapa"></div>

<div id="controlTiempo">

Año: <span id="valorAnio">2019</span>

<br><br>

<input type="range" min="2019" max="2026" value="2019"
oninput="actualizarAnio(this.value)">

<div id="contadorPredios">
287 PREDIOS
</div>

</div>

<div id="buscadorPredio">

Buscar Predio<br>

<input type="text" id="textoBuscar" placeholder="Clave, propietario o cédula">

<button onclick="buscarPredio()">Buscar</button>

</div>

<script>

/* CONTADOR POR AÑO */

var conteoPredios={
2019:287,
2020:307,
2021:1048,
2022:339,
2023:524,
2024:793,
2025:455,
total:3753
};


/* CAPAS BASE */

var googleHybrid=L.tileLayer(
'https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',{
maxZoom:20,
subdomains:['mt0','mt1','mt2','mt3'],
opacity:0.6
});


var map=L.map("mapa",{
center:[-0.999491,-80.761089],
zoom:14,
layers:[googleHybrid],
fullscreenControl:true
});


/* VARIABLES */

var capa2019,capa2020,capa2021,capa2022,capa2023,capa2024,capa2025;


/* FUNCION CREAR CAPA */

function crearCapa(datos,relleno,contorno){

return L.geoJson(datos,{
style:{
color:contorno,
weight:2,
fillColor:relleno,
fillOpacity:0.5
}
});

}


/* MOSTRAR CAPA */

function mostrarCapa(anio){

[capa2019,capa2020,capa2021,capa2022,capa2023,capa2024,capa2025]
.forEach(function(c){

if(c && map.hasLayer(c)){
map.removeLayer(c);
}

});

if(anio==2019) map.addLayer(capa2019);
if(anio==2020) map.addLayer(capa2020);
if(anio==2021) map.addLayer(capa2021);
if(anio==2022) map.addLayer(capa2022);
if(anio==2023) map.addLayer(capa2023);
if(anio==2024) map.addLayer(capa2024);
if(anio==2025) map.addLayer(capa2025);

if(anio==2026){

map.addLayer(capa2019);
map.addLayer(capa2020);
map.addLayer(capa2021);
map.addLayer(capa2022);
map.addLayer(capa2023);
map.addLayer(capa2024);
map.addLayer(capa2025);

}

}


/* ACTUALIZAR AÑO */

function actualizarAnio(anio){

var textoAnio=document.getElementById("valorAnio");
var contador=document.getElementById("contadorPredios");

if(anio==2026){

textoAnio.innerHTML="TODOS";
contador.innerHTML=conteoPredios.total+" PREDIOS";

}else{

textoAnio.innerHTML=anio;
contador.innerHTML=conteoPredios[anio]+" PREDIOS";

}

mostrarCapa(anio);

}


/* CARGAR CAPAS */

function cargar(url,color,borde,variable){

fetch(url)
.then(r=>r.json())
.then(data=>{

window[variable]=crearCapa(data,color,borde);

if(variable=="capa2019"){
map.addLayer(window[variable]);
}

});

}

cargar("https://raw.githubusercontent.com/Antonio20252025/Catastro_Legalizacion/main/2019.geojson","yellow","blue","capa2019");
cargar("https://raw.githubusercontent.com/Antonio20252025/Catastro_Legalizacion/main/2020.geojson","violet","purple","capa2020");
cargar("https://raw.githubusercontent.com/Antonio20252025/Catastro_Legalizacion/main/2021.geojson","orange","darkred","capa2021");
cargar("https://raw.githubusercontent.com/Antonio20252025/Catastro_Legalizacion/main/2022.geojson","pink","red","capa2022");
cargar("https://raw.githubusercontent.com/Antonio20252025/Catastro_Legalizacion/main/2023.geojson","cyan","darkblue","capa2023");
cargar("https://raw.githubusercontent.com/Antonio20252025/Catastro_Legalizacion/main/2024.geojson","sandybrown","brown","capa2024");
cargar("https://raw.githubusercontent.com/Antonio20252025/Catastro_Legalizacion/main/2025.geojson","white","yellow","capa2025");


/* BUSCAR */

function buscarPredio(){

var texto=document.getElementById("textoBuscar").value.toLowerCase();

var capas=[capa2019,capa2020,capa2021,capa2022,capa2023,capa2024,capa2025];

capas.forEach(function(capa){

if(capa){

capa.eachLayer(function(layer){

var p=layer.feature.properties;

if(
(p.clavecatas && p.clavecatas.toLowerCase().includes(texto)) ||
(p.propietari && p.propietari.toLowerCase().includes(texto)) ||
(p.documentop && p.documentop.toLowerCase().includes(texto))
){

map.fitBounds(layer.getBounds());
layer.openPopup();

}

});

}

});

}

</script>

</body>
</html>
